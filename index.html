<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بنيان — Bunyan</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1b1d21;
        --muted: #5b6069;
        --rule: #e2e5ea;
        --accent: #b8860b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --text: #e8eaed;
          --muted: #9aa1ab;
          --rule: #262a32;
          --accent: #ffd54a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, -apple-system, sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 460px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 26px;
      }
      a.link {
        display: inline-block;
        padding: 11px 22px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
      }
      a.link:hover {
        border-color: var(--accent);
      }
      footer {
        margin-top: 34px;
        color: var(--muted);
        font-size: 0.82rem;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>بنيان</h1>
      <p>تطبيق تدريب بالأثقال</p>
      <p class="en" dir="ltr">Bunyan, a strength-training app</p>
      <a class="link" href="./privacy-policy/">سياسة الخصوصية · Privacy Policy</a>
      <footer>com.midoshehaa.fitnessapp</footer>
    </main>
  </body>
</html>
